name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify generated templates
        run: make check-templates

      - name: Run tests
        run: make test-scholar

      - name: Verify Lean4 (if available)
        run: |
          if command -v lake &> /dev/null; then
            cd LEAN && lake build && cd ..
          else
            echo "Lean4 not installed, skipping"
          fi
        continue-on-error: true

      - name: Verify MCP import
        run: |
          python -c "from scholar_mcp.server import mcp; print('MCP server OK')"

  proxy-hub-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Proxy Hub backend
        run: pip install -e "services/proxy-hub/backend[dev]"

      - name: Check backend
        run: make check-proxy-backend

      - name: Exercise migrations
        working-directory: services/proxy-hub/backend
        env:
          PROXY_HUB_ENVIRONMENT: test
          PROXY_HUB_DATABASE_URL: sqlite:///migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  proxy-hub-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: services/proxy-hub/frontend/package-lock.json

      - name: Install npm
        run: npm install --global npm@11.6.2

      - name: Install Proxy Hub frontend
        working-directory: services/proxy-hub/frontend
        run: npm ci

      - name: Check frontend
        run: make check-proxy-frontend

      - name: Validate local deployment
        env:
          PROXY_HUB_DATABASE_PASSWORD: ci-password
          PROXY_HUB_PORT: "18080"
          PROXY_HUB_OIDC_ISSUER_URL: https://identity.example.test
          PROXY_HUB_OIDC_CLIENT_ID: ci-client
          PROXY_HUB_OIDC_CLIENT_SECRET: ci-secret
        run: |
          cleanup() {
            docker compose -f infra/proxy-hub/compose.yml down -v
          }
          trap cleanup EXIT
          docker compose -f infra/proxy-hub/compose.yml config --quiet
          docker compose -f infra/proxy-hub/compose.yml up --build -d --wait
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:18080/console/)" = 200
          test "$(curl -sS -o /tmp/proxy-hub-auth.json -w '%{http_code}' \
            http://127.0.0.1:18080/v1/admin/me)" = 401
          python -c "import json; assert json.load(open('/tmp/proxy-hub-auth.json'))['error']['code'] == 'browser_session_required'"
