[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scholar-proxy-hub"
version = "0.1.0"
description = "Proxy Hub control plane and Scholar MCP gateway"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4.10,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "joserfc>=1.6,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0.43,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
proxy-hub = "proxy_hub.app:run"

[tool.hatch.build.targets.wheel]
packages = ["proxy_hub"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
