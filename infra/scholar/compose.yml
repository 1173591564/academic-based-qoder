services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scholar-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: scholar
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../scholar/v2/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
