[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-studio"
version = "0.2.1"
description = "AI Academic Research Engine --璁烘枃瑙ｆ瀽銆佺煡璇嗗浘璋便€丷AG 妫€绱€佸鏈啓浣滃叏娴佺▼"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.23",
    "mcp>=1.0",
    "rapidfuzz>=3.0",
    "bibtexparser>=1.4",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark>=4.0"]

[project.scripts]
scholar = "scholar.cli:main"

[tool.setuptools.packages.find]
include = ["scholar*", "scholar_mcp*"]

[tool.setuptools.package-data]
scholar = ["*.json", "*.txt", "templates/**/*"]
