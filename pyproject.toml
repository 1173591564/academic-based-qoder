[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-studio"
version = "0.2.2"
description = "AI Academic Research Engine --鐠佺儤鏋冪憴锝嗙€介妴浣虹叀鐠囧棗娴樼拫渚库偓涓稟G 濡偓缁鳖潿鈧礁顒熼張顖氬晸娴ｆ粌鍙忓ù浣衡柤"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.23",
    "mcp>=1.0,<2",
    "rapidfuzz>=3.0",
    "bibtexparser>=1.4",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark>=4.0"]

[project.scripts]
scholar = "scholar.cli:main"

[tool.setuptools.packages.find]
include = ["scholar*", "scholar_mcp*"]

[tool.setuptools.package-data]
scholar = ["*.json", "*.txt", "templates/**/*"]
